name: dataforge

# Configuracion compartida por la API y los workers. Son el MISMO codigo en la
# misma imagen, corriendo como dos procesos distintos, asi que tienen que ver
# exactamente las mismas variables: si el worker apuntara a otra base o a otro
# bucket, escribiria resultados donde la API nunca los va a buscar. Un anchor de
# YAML lo garantiza; copiar y pegar el bloque garantiza lo contrario.
x-app-build: &app-build
  context: ./backend
  dockerfile: Dockerfile

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dataforge:dataforge_dev_password@postgres:5432/dataforge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
  # `minio` es el hostname del servicio dentro de la red de compose, y el
  # puerto es el interno (9000), no el publicado en el host.
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dataforge}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dataforge_dev_password}
  MINIO_BUCKET: ${MINIO_BUCKET:-dataforge-datasets}

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  # --- Reverse proxy: entrypoint único para frontend + API + consolas de infra ---
  traefik:
    # v3.1 no sirve con Docker Engine 29+: su provider pide la API 1.24 del
    # daemon y desde la 29 el minimo aceptado es 1.44, asi que Traefik no
    # descubre ningun contenedor y todo responde 404. v3.7 negocia una version
    # soportada.
    image: traefik:v3.7.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      # En Windows el puerto 80 suele estar tomado (IIS, "World Wide Web
      # Publishing Service" o rangos reservados por Hyper-V). Si `docker compose
      # up` falla con "port is already allocated", poné TRAEFIK_HTTP_PORT=8081
      # en tu .env y entrá por http://dataforge.localhost:8081
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dataforge

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataforge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dataforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dataforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dataforge_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge

  redis:
    # Broker/result-backend de Celery. No se consume todavía en Fase 0, pero
    # queda arriba desde el inicio porque Fase 1+ lo necesita de inmediato.
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge

  backend:
    build: *app-build
    environment: *app-env
    depends_on: *app-depends
    volumes:
      - ./backend:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`dataforge.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.backend-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=backend-strip"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    networks:
      - dataforge

  worker:
    # Mismo build y mismas variables que el backend: cambia el proceso, no el
    # codigo. Escalable con `docker compose up -d --scale worker=3` — Redis
    # reparte las tareas entre todos los que esten escuchando la cola.
    build: *app-build
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment: *app-env
    depends_on: *app-depends
    # El bind mount permite editar tareas sin rebuildear, pero Celery no
    # recarga solo como uvicorn: despues de tocar una tarea hay que hacer
    # `docker compose restart worker`.
    volumes:
      - ./backend:/app
    networks:
      - dataforge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://dataforge.localhost/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dataforge.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    networks:
      - dataforge

networks:
  dataforge:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  redisdata:
