name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge_dev_password
          POSTGRES_DB: dataforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dataforge:dataforge_dev_password@localhost:5432/dataforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app tests

      # Los fixtures construyen el esquema corriendo Alembic contra el servicio
      # postgres de arriba, así que esto también valida las migraciones.
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check + build
        run: npm run build
