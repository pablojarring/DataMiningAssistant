name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge_dev_password
          POSTGRES_DB: dataforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dataforge:dataforge_dev_password@localhost:5432/dataforge
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: dataforge
      MINIO_ROOT_PASSWORD: dataforge_dev_password
    steps:
      - uses: actions/checkout@v4

      # MinIO va como paso y no como `services:` porque necesita argumentos de
      # comando (`server /data`), y el bloque `services` de Actions solo permite
      # imagen, env, puertos y opciones de `docker run` — no los args. Levantarlo
      # a mano además deja la misma imagen pineada que usa docker-compose, así
      # que CI y desarrollo local corren exactamente el mismo MinIO.
      - name: Levantar MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=dataforge \
            -e MINIO_ROOT_PASSWORD=dataforge_dev_password \
            minio/minio:RELEASE.2024-11-07T00-52-20Z server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO listo"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO no respondió en 60s"
          docker logs minio
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app tests conftest.py

      # Los fixtures construyen el esquema corriendo Alembic contra el servicio
      # postgres de arriba, así que esto también valida las migraciones. Los
      # tests de subida hablan con el MinIO real levantado más arriba.
      # La base que usan es `dataforge_test`, creada sola por el conftest de la
      # raíz del backend (ver ahí el porqué); el usuario del servicio es dueño
      # de la instancia, así que puede crearla.
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check + build
        run: npm run build
