[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en un default de argumento es EL idioma de FastAPI para
# inyección de dependencias, no el bug mutable-default que B008 busca cazar.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.isort]
# `alembic/` es el directorio de scripts de migracion, no un paquete nuestro
# (no tiene __init__.py). Sin esto, ruff lo clasifica como first-party solo por
# el nombre de la carpeta y exige agrupar `from alembic...` junto a
# `from app...`, mezclando una libreria de terceros con nuestro propio codigo.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
